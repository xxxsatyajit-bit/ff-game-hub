<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Tournament Management</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glassmorphism {
            background: rgba(17, 24, 39, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 glassmorphism shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-black text-amber-500 tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-trophy"></i> FF TOURNAMENT
            </h1>
            <nav class="flex items-center gap-3 md:gap-6">
                <button onclick="switchTab('home')" class="hover:text-amber-400 font-semibold text-sm md:text-base"><i class="fa-solid fa-house"></i> Home</button>
                <button onclick="switchTab('admin')" class="hover:text-amber-400 font-semibold text-sm md:text-base"><i class="fa-solid fa-user-shield"></i> Admin Panel</button>
                <div id="authContainer">
                    <button id="loginBtn" onclick="handleAuth()" class="bg-amber-500 hover:bg-amber-600 text-black font-bold px-3 py-1.5 rounded-lg text-sm transition">Login</button>
                </div>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">

        <!-- Home View -->
        <section id="homeView" class="space-y-6">
            <div class="bg-gradient-to-r from-amber-600 to-amber-800 rounded-2xl p-6 md:p-10 text-white shadow-xl">
                <h2 class="text-2xl md:text-4xl font-extrabold mb-2">Free Fire টুর্নামেন্টে যোগ দিন!</h2>
                <p class="text-amber-100 text-sm md:text-base">আপনার স্কোয়াড নিয়ে অংশগ্রহণ করুন এবং জয় করে নিন আকর্ষণীয় পুরষ্কার।</p>
            </div>

            <h3 class="text-xl font-bold text-amber-400 border-l-4 border-amber-500 pl-3">রানিং টুর্নামেন্ট সমূহ</h3>
            <div id="tournamentsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Tournaments will be injected dynamically -->
                <p class="text-gray-400 text-sm">টুর্নামেন্ট লোড হচ্ছে...</p>
            </div>
        </section>

        <!-- Admin View -->
        <section id="adminView" class="hidden space-y-6">
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-lg">
                <h2 class="text-xl font-bold text-amber-400 mb-4 border-b border-gray-800 pb-2"><i class="fa-solid fa-plus-circle"></i> নতুন টুর্নামেন্ট যোগ করুন</h2>
                <form id="createTournamentForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="title" placeholder="টুর্নামেন্টের নাম" class="bg-gray-800 border border-gray-700 p-2.5 rounded-lg w-full text-white focus:outline-none focus:border-amber-500" required>
                    <input type="number" id="entryFee" placeholder="এন্ট্রি ফি (টাকা)" class="bg-gray-800 border border-gray-700 p-2.5 rounded-lg w-full text-white focus:outline-none focus:border-amber-500" required>
                    <input type="number" id="prizePool" placeholder="প্রাইজ পুল (টাকা)" class="bg-gray-800 border border-gray-700 p-2.5 rounded-lg w-full text-white focus:outline-none focus:border-amber-500" required>
                    <input type="datetime-local" id="matchTime" class="bg-gray-800 border border-gray-700 p-2.5 rounded-lg w-full text-white focus:outline-none focus:border-amber-500" required>
                    <input type="text" id="roomId" placeholder="রুম আইডি (Room ID)" class="bg-gray-800 border border-gray-700 p-2.5 rounded-lg w-full text-white focus:outline-none focus:border-amber-500">
                    <input type="text" id="roomPass" placeholder="পাসওয়ার্ড (Password)" class="bg-gray-800 border border-gray-700 p-2.5 rounded-lg w-full text-white focus:outline-none focus:border-amber-500">
                    <button type="submit" class="md:col-span-2 bg-amber-500 hover:bg-amber-600 text-black font-bold py-2.5 rounded-lg transition">টুর্নামেন্ট তৈরি করুন</button>
                </form>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 border-t border-gray-800 py-4 text-center text-xs text-gray-500">
        &copy; 2026 Free Fire Tournament Zone. All rights reserved.
    </footer>

    <!-- Firebase Script Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyANredBWaU-YxNKPkub_w-BkyAfVjX4yfo",
            authDomain: "ff-tournament-1b4c9.firebaseapp.com",
            projectId: "ff-tournament-1b4c9",
            storageBucket: "ff-tournament-1b4c9.firebasestorage.app",
            messagingSenderId: "749214669988",
            appId: "1:749214669988:web:e1e09ec20b7645ad76da31"
        };

        // Initialize Firebase Services
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        // Authentication State Listener
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const authContainer = document.getElementById('authContainer');
            if (user) {
                authContainer.innerHTML = `
                    <div class="flex items-center gap-2">
                        <img src="${user.photoURL}" class="w-8 h-8 rounded-full border border-amber-500">
                        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-2.5 py-1.5 rounded-lg transition">Logout</button>
                    </div>
                `;
            } else {
                authContainer.innerHTML = `
                    <button onclick="login()" class="bg-amber-500 hover:bg-amber-600 text-black font-bold px-3 py-1.5 rounded-lg text-sm transition">Login</button>
                `;
            }
        });

        // Auth Functions
        window.login = () => signInWithPopup(auth, provider).catch(err => alert(err.message));
        window.logout = () => signOut(auth);

        // Tab Switching Logic
        window.switchTab = (tab) => {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('adminView').classList.add('hidden');
            
            if (tab === 'home') document.getElementById('homeView').classList.remove('hidden');
            if (tab === 'admin') document.getElementById('adminView').classList.remove('hidden');
        };

        // Add Tournament Logic
        const form = document.getElementById('createTournamentForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return alert("অনুগ্রহ করে প্রথমে লগইন করুন!");

            try {
                await addDoc(collection(db, "tournaments"), {
                    title: document.getElementById('title').value,
                    entryFee: document.getElementById('entryFee').value,
                    prizePool: document.getElementById('prizePool').value,
                    matchTime: document.getElementById('matchTime').value,
                    roomId: document.getElementById('roomId').value || "TBA",
                    roomPass: document.getElementById('roomPass').value || "TBA",
                    createdAt: new Date()
                });
                alert("টুর্নামেন্ট সফলভাবে যোগ করা হয়েছে!");
                form.reset();
            } catch (err) {
                alert("এরর: " + err.message);
            }
        });

        // Real-time Tournament Listener
        onSnapshot(collection(db, "tournaments"), (snapshot) => {
            const list = document.getElementById('tournamentsList');
            list.innerHTML = "";
            
            if(snapshot.empty) {
                list.innerHTML = `<p class="text-gray-400 text-sm">কোনো টুর্নামেন্ট পাওয়া যায়নি।</p>`;
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                list.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 hover:border-amber-500/50 transition">
                        <h4 class="text-lg font-bold text-amber-400 mb-2">${data.title}</h4>
                        <div class="space-y-1 text-sm text-gray-300 mb-4">
                            <p><i class="fa-solid fa-coins text-amber-500 w-5"></i> এন্ট্রি ফি: ৳${data.entryFee}</p>
                            <p><i class="fa-solid fa-trophy text-amber-500 w-5"></i> প্রাইজ পুল: ৳${data.prizePool}</p>
                            <p><i class="fa-solid fa-clock text-amber-500 w-5"></i> সময়: ${new Date(data.matchTime).toLocaleString()}</p>
                        </div>
                        <div class="bg-gray-950 p-3 rounded-lg text-xs space-y-1 mb-4 border border-gray-800">
                            <p><span class="text-gray-400">Room ID:</span> <span class="font-mono text-amber-400 font-bold">${data.roomId}</span></p>
                            <p><span class="text-gray-400">Password:</span> <span class="font-mono text-amber-400 font-bold">${data.roomPass}</span></p>
                        </div>
                        <button class="w-full bg-amber-500 hover:bg-amber-600 text-black font-bold py-2 rounded-lg text-sm transition">Join Match</button>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
